# Codemagic setup for "Fill My Lunch Bag" (iPhone / App Store)
# This file tells Codemagic how to turn the app into an iPhone app
# and send it to Apple (TestFlight / App Store Connect).

workflows:
  ios-release:
    name: iPhone App Store build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Same Apple key you already use in Codemagic for Bible Verses and Busy Bee
      app_store_connect: Codemagic App Store key

    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lizrodriguez.fillmylunchbag

    scripts:
      - name: Check the app screens are in the www folder
        script: |
          ls -la www www/vendor
          test -f www/index.html

      - name: Install Capacitor
        script: |
          npm install

      - name: Make the app icon
        script: |
          mkdir -p assets
          cp icon.png assets/icon-download.png
          # Apple does not allow see-through icons, so flatten it to a solid image
          sips -s format jpeg assets/icon-download.png --out assets/icon-flat.jpg
          sips -s format png assets/icon-flat.jpg --out assets/icon.png
          sips -z 1024 1024 assets/icon.png
          rm assets/icon-download.png assets/icon-flat.jpg

      - name: Add the iPhone project
        script: |
          npx cap add ios

      - name: Make all the iPhone icon sizes
        script: |
          npx --yes @capacitor/assets generate --ios --assetPath assets

      - name: Copy the app into the iPhone project
        script: |
          npx cap sync ios

      - name: Turn on tip alerts (push notifications)
        script: |
          # 1) Tell Apple this app sends notifications
          cat > ios/App/App/App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
          </dict>
          </plist>
          PLIST
          sed -i '' 's/^[[:space:]]*//' ios/App/App/App.entitlements
          grep -q "CODE_SIGN_ENTITLEMENTS" ios/App/App.xcodeproj/project.pbxproj || \
            sed -i '' 's/\(PRODUCT_BUNDLE_IDENTIFIER = [^;]*;\)/\1\
          CODE_SIGN_ENTITLEMENTS = App\/App.entitlements;/' ios/App/App.xcodeproj/project.pbxproj
          grep -n "CODE_SIGN_ENTITLEMENTS" ios/App/App.xcodeproj/project.pbxproj
          # 2) Hand the phone's alert address to the app (Capacitor push setup)
          APPDELEGATE=ios/App/App/AppDelegate.swift
          if ! grep -q "capacitorDidRegisterForRemoteNotifications" "$APPDELEGATE"; then
            perl -0pi -e 's/(\n\}\s*)\z/\n    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {\n        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)\n    }\n\n    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {\n        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)\n    }\n}\n/' "$APPDELEGATE"
          fi
          grep -n "RemoteNotifications" "$APPDELEGATE"

      - name: Set version, build number, and permission messages
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.1" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.1" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          # Needed when a creator picks a profile photo (required by Apple)
          plutil -replace NSPhotoLibraryUsageDescription -string "Choose a profile photo for your Fill My Lunch Bag page." "$PLIST"
          plutil -replace NSCameraUsageDescription -string "Take a profile photo for your Fill My Lunch Bag page." "$PLIST"
          # App link so Google / Apple sign-in in Safari can come back to the app
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.lizrodriguez.fillmylunchbag" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.lizrodriguez.fillmylunchbag" "$PLIST"
          # iPhone only (no iPad layout)
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" || true
          cd ios/App
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' App.xcodeproj/project.pbxproj || true
          agvtool new-version -all $BUILD_NUMBER

      - name: Set up Apple signing
        script: |
          xcode-project use-profiles

      - name: Build the iPhone app
        script: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
          else
            xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - lizz84533@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
